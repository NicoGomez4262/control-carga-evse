<svg width="100%" viewBox="0 0 680 268" role="img"><title>F6_s3_j2</title><desc>J2 de 2 polos (TB001-500-02BE, ED1621 de Sigma): pin 1 a la red EVSE_EN_A y pin 2 a EVSE_EN_B, dentro de la zona EVSE_EXT con su Blanket.</desc>
<rect class="c-coral" x="150" y="40" width="360" height="150" rx="10" style="stroke:none"/><g class="box"><rect x="370" y="68" width="70" height="110" rx="4" stroke-width="0.8"/></g><g style="stroke:var(--text-primary);stroke-width:1.3;fill:none"><path d="M220 90 L330 90 M220 130 L330 130 M330 90 L370 90 M330 130 L370 130"/></g><g style="stroke:var(--text-primary);stroke-width:2.2;fill:none"></g><g style="fill:var(--text-primary)"></g><g class="c-blue"><text class="th" x="226" y="81" dy=".35em">EVSE_EN_A</text></g><g class="c-blue"><text class="th" x="226" y="121" dy=".35em">EVSE_EN_B</text></g><text class="th" x="405" y="58" text-anchor="middle" dy=".35em">J2</text><text class="ts" x="405" y="192" text-anchor="middle" dy=".35em">TB001-500-02BE · Sigma ED1621</text><text class="ts" x="375" y="90" dy=".35em">1 </text><text class="ts" x="375" y="130" dy=".35em">2 </text><text class="ts" x="470" y="90" dy=".35em">→ borne de habilitación A del EVSE</text><text class="ts" x="470" y="130" dy=".35em">→ borne de habilitación B</text><text class="ts" x="160" y="56" dy=".35em">zona EVSE_EXT</text><text class="ts" x="20" y="222" dy=".35em">Blanket sobre los cables de EVSE_EN_A y EVSE_EN_B con un Parameter Set de clase de red EVSE_EXT (como HV_AC).</text><text class="ts" x="20" y="238" dy=".35em">Reglas en F8: ≥ 6,4 mm de fuga y ≥ 5,5 mm en el aire hacia todo el SELV (incluido GND) y hacia HV_AC.</text><text class="ts" x="20" y="254" dy=".35em">Serigrafía de J2: «EVSE EN». Sin polaridad (salida AC/DC). Para un EVSE que pida NA se monta AQY214EHAX en K1.</text>
