g class="c-amber"><polygon points="14,230 23,221 105,221 114,230 105,239 23,239" stroke-width="0.8"/><text class="ts" x="64" y="230" text-anchor="middle" dy=".35em">OW_DATA</text></g><g class="c-blue"><text class="th" x="150" y="150" text-anchor="middle" dy=".35em">+3V3</text></g><text class="th" x="138" y="185" text-anchor="end" dy=".35em">R35</text><text class="ts" x="138" y="200" text-anchor="end" dy=".35em">4,7 kΩ</text><text class="ts" x="138" y="214" text-anchor="end" dy=".35em">RC0805FR-074K7L</text><text class="th" x="230" y="214" text-anchor="middle" dy=".35em">R36</text><text class="ts" x="230" y="248" text-anchor="middle" dy=".35em">100 Ω</text><text class="ts" x="230" y="262" text-anchor="middle" dy=".35em">RC0805FR-07100RL</text><g class="c-blue"><text class="th" x="268" y="221" dy=".35em">OW_J4</text></g><text class="th" x="410" y="198" text-anchor="middle" dy=".35em">D6</text><text class="ts" x="410" y="342" text-anchor="middle" dy=".35em">USBLC6-2SC6</text><text class="ts" x="355" y="230" dy=".35em">1 I/O1_1</text><text class="ts" x="355" y="260" dy=".35em">2 GND</text><text class="ts" x="355" y="290" dy=".35em">3 I/O2_1</text><path d="M315 285 L325 295 M325 285 L315 295" stroke="#E24B4A" stroke-width="1.6" fill="none"/><text class="ts" x="465" y="230" text-anchor="end" dy=".35em">I/O1_2 6</text><text class="ts" x="465" y="260" text-anchor="end" dy=".35em">VBUS 5</text><g class="c-blue"><text class="th" x="504" y="251" dy=".35em">J4_3V3</text></g><text class="ts" x="465" y="290" text-anchor="end" dy=".35em">I/O2_2 4</text><path d="M495 285 L505 295 M505 285 L495 295" stroke="#E24B4A" stroke-width="1.6" fill="none"/><g class="c-blue"><text class="th" x="506" y="221" dy=".35em">OW_J4</text></g><text class="th" x="630" y="168" text-anchor="middle" dy=".35em">J4</text><text class="ts" x="630" y="312" text-anchor="middle" dy=".35em">1751251</text><text class="ts" x="605" y="200" dy=".35em">1 3V3</text><text class="ts" x="605" y="230" dy=".35em">2 DATA</text><text class="ts" x="605" y="260" dy=".35em">3 GND</text><text class="ts" x="20" y="372" dy=".35em">OW_J4 va en los dos lados de D6: los pines 1 y 6 son la misma línea por dentro, pero en Altium son pines distintos.</text><text class="ts" x="20" y="388" dy=".35em">Serigrafía de J4: 3V3 · DQ · GND (rojo, amarillo, negro en la sonda de Sigma; verificar al comprar).</text>
</svg>