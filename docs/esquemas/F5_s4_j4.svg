<svg width="100%" viewBox="0 0 680 402" role="img"><title>F5_s4_j4</title><desc>J4 de la sonda: +3V3 por R37 de 68 ohm a la red J4_3V3, con C40 de 100 nanofaradios a GND, hasta J4 pin 1. Puerto OW_DATA con R35 de 4,7 kiloohm a +3V3, R36 de 100 ohm hasta OW_J4, que entra por D6 pin 1 y sale por D6 pin 6 hasta J4 pin 2. D6 pin 5 VBUS a J4_3V3, pin 2 a GND, pines 3 y 4 con No ERC. J4 pin 3 a GND.</desc>
