<svg width="100%" viewBox="0 0 680 364" role="img"><title>F6_s2_k1</title><desc>+VIN pasa por R41 de 1 kiloohm y por LED6 KT-0805Y (ánodo arriba) hasta K1 pin 1, el ánodo del LED del PhotoMOS AQY414EHAX. K1 pin 2 va a la red RELAY_DRV. K1 pin 4 va a EVSE_EN_A y pin 3 a EVSE_EN_B, dentro de la zona EVSE_EXT.</desc>
<rect class="c-coral" x="425" y="120" width="245" height="170" rx="10" style="stroke:none"/><g class="box"><rect x="330" y="170" width="190" height="110" rx="4" stroke-width="0.8"/></g><g style="stroke:var(--text-primary);stroke-width:1.3;fill:none"><path d="M100 60 L100 50 M100 60 L100 70 M100 110 L100 120 M100 120 L100 140 M91 140 L109 140 L100 156 Z M100 156 L100 180 M100 180 L100 192 L290 192 M290 192 L330 192 M290 232 L330 232 M520 192 L560 192 M520 232 L560 232"/><rect x="94" y="70" width="12" height="40" rx="1"/></g><g style="stroke:var(--text-primary);stroke-width:2.2;fill:none"><line x1="92" y1="50" x2="108" y2="50"/><line x1="91" y1="156" x2="109" y2="156"/></g><g style="fill:var(--text-primary)"></g><g class="c-blue"><text class="th" x="100" y="40" text-anchor="middle" dy=".35em">+VIN</text></g><text class="th" x="112" y="75" dy=".35em">R41</text><text class="ts" x="112" y="90" dy=".35em">1 kΩ</text><text class="ts" x="112" y="104" dy=".35em">RC0805FR-071KL</text><text class="th" x="114" y="138" dy=".35em">LED6</text><text class="ts" x="114" y="153" dy=".35em">amarillo</text><text class="ts" x="114" y="167" dy=".35em">KT-0805Y</text><text class="th" x="425" y="160" text-anchor="middle" dy=".35em">K1</text><text class="ts" x="425" y="294" text-anchor="middle" dy=".35em">AQY414EHAX · NC (1 Form B)</text><text class="ts" x="335" y="192" dy=".35em">1 LED +</text><text class="ts" x="335" y="232" dy=".35em">2 LED −</text><g class="c-blue"><text class="th" x="286" y="223" text-anchor="end" dy=".35em">RELAY_DRV</text></g><text class="ts" x="515" y="192" text-anchor="end" dy=".35em">salida 4</text><g class="c-blue"><text class="th" x="564" y="183" dy=".35em">EVSE_EN_A</text></g><text class="ts" x="515" y="232" text-anchor="end" dy=".35em">salida 3</text><g class="c-blue"><text class="th" x="564" y="223" dy=".35em">EVSE_EN_B</text></g><line x1="425" y1="172" x2="425" y2="278" stroke="#E24B4A" stroke-width="1.4" stroke-dasharray="5 4"/><text class="ts" x="548" y="136" text-anchor="middle" dy=".35em">zona EVSE_EXT (externa)</text><text class="ts" x="20" y="318" dy=".35em">Corriente del LED: (11,6 − 2,0 − 1,25) V / 1 kΩ ≈ 8,4 mA. Datasheet: 5–10 mA recomendado; la salida se abre con</text><text class="ts" x="20" y="334" dy=".35em">≤ 3 mA a 25 °C (≈ 3,4 mA a 85 °C) → margen de 2,5×. LED6 encendido = salida abierta = carga parada.</text><text class="ts" x="20" y="350" dy=".35em">La línea roja es la barrera: los pines 3 y 4 (y todo lo que va a J2) quedan a ≥ 6,4 mm del lado SELV.</text>
</svg>