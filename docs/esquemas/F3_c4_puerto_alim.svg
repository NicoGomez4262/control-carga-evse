<svg width="100%" viewBox="0 0 680 280" role="img"><title>c4_puerto_alim</title><desc>A la izquierda, como está hoy: el nombre +3V3 es una net label azul sobre el cable de los pines 1 y 3 de U3 y sobre R16. A la derecha, como debe quedar: en el mismo extremo de cable, un puerto de alimentación con barra llamado +3V3.</desc>
