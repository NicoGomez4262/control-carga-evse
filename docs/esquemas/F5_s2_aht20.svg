<svg width="100%" viewBox="0 0 680 398" role="img"><title>F5_s2_aht20</title><desc>U6 AHT20: pin 2 VDD a la red AHT_VDD, pin 3 SCL a I2C_SCL, pin 4 SDA a I2C_SDA, pin 5 GND, pines 1 y 6 con No ERC. Filtro: +3V3, R38 de 330 ohm hasta AHT_VDD, con C37 de 10 microfaradios y C38 de 100 nanofaradios a GND.</desc>
