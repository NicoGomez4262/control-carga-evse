<svg width="100%" viewBox="0 0 680 332" role="img"><title>F6_s1_driver</title><desc>Puerto RELAY_EN de entrada, R39 de 1 kiloohm en serie hasta el gate de Q3 AO3400A, R40 de 10 kiloohm del gate a GND, source de Q3 a GND y drain a la red RELAY_DRV.</desc>
