 y="302" dy=".35em">R40 (gate a GND) apaga Q3 mientras la ESP32 arranca: el LED de K1 no recibe corriente y su salida queda</text><text class="ts" x="20" y="318" dy=".35em">cerrada (NC) → el EVSE puede cargar. RELAY_EN = 1 → VGS = 3,3 V · 10/11 = 3,0 V (AO3400A: ≤ 48 mΩ con 2,5 V).</text>
