<svg width="100%" viewBox="0 0 680 470" role="img"><title>F4_s6_usb</title><desc>J5 USB-C Würth 632723300011: VBUS (A4 B4 A9 B9) a VBUS, D+ (A6 B6) a USB_DP, D− (A7 B7) a USB_DN, CC1 y CC2 a R23 y R24 de 5,1 kΩ a GND, GND y carcasa a GND, pares SuperSpeed y SBU con No ERC. D5 USBLC6-2SC6: pines 1 y 6 a USB_DP, 3 y 4 a USB_DN, 5 a VBUS, 2 a GND.</desc>
