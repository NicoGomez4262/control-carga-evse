; Firmware de pruebas de la placa EVSE Monitor Rev 1.0 (S1–S6 de docs/pruebas/PROTOCOLO_PRUEBAS.md).
; Módulo: ESP32-S3-WROOM-1-N16R2 (flash de 16 MB QIO, PSRAM de 2 MB quad).
; Consola y programación por UART0 (IO43/IO44) a través del CH340C en J5. El USB nativo no está conectado.

[env:placa]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
