; Firmware final de la placa EVSE Monitor Rev 1.0 (Fase 10D).
; ESP32-S3-WROOM-1-N16R2: flash de 16 MB QIO, PSRAM de 2 MB quad. Consola por UART0 (CH340C, J5).
; Arduino-ESP32 2.0.17 (ESP-IDF 4.4) sobre PlatformIO (D21).

[env:placa]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; 2 × 4 MB de aplicación (OTA), NVS de 64 KB y 7 MB de búfer sin internet (D14).
board_build.partitions = particiones.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
    -Iinclude

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.6.1
